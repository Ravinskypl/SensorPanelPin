name: Release

# Push a tag such as v2.0.0 that matches <Version> in SensorPanelPin.csproj. The package is built
# here, not on anyone's computer, and carries a signed provenance attestation that ties the ZIP to
# this workflow run and commit: gh attestation verify <zip> --repo Ravinskypl/SensorPanelPin

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw src/SensorPanelPin/SensorPanelPin.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match project version $version." }

      - name: Test and package
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.zip

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item artifacts/*.zip).FullName artifacts/SHA256SUMS.txt `
            --title "SensorPanelPin ${{ github.ref_name }}" --generate-notes
